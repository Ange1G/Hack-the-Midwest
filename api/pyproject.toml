[project]
name = "api"
version = "0.1.0"
description = "Stragents HTTP API"
readme = "README.md"
authors = [
    { name = "Jesus Garcia", email = "devwithjesus.business@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.14.0",
    "asyncpg>=0.30.0",
    "cryptography>=44.0.0",
    "fastapi[standard]>=0.143.0",
    "jsonschema>=4.23,<5",
    "pydantic-settings>=2.7.0",
    "sqlalchemy[asyncio]>=2.0.36",
]

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]

[project.scripts]
agent-worker = "app.worker.__main__:main"
agent-scheduler = "app.scheduler.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]
